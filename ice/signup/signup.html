<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daily Feed Sign Up</title>

        <style>
            * {
                margin: 0;
            }

            body {
                background: rgb(120, 96, 64);
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
            }
            header {
                background-image: url(images/jesus_feeds_5000.jpeg);
                padding-top: 100px;
                background-size: cover;
                padding-bottom: 15px;
            }
            h1,
            h2 {
                color: white;
                font-family: "Times New Roman", Times, serif;
                text-align: center;
                text-shadow: 1px 1px black;
            }
            h3 {
                padding: 20px;
                text-align: center;
            }
            section {
                grid-column: 1/ 3;
                justify-self: center;
            }
            #formContainer {
                grid-column: 2/3;
                border: 5px blue solid;
                border-radius: 5px;
                background-color: white;
                width: 400px;
                margin-top: 50px;
            }
            #myForm {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                padding: 15px;
            }
            #closeBtn {
                position: absolute;
                top: 65px;
            }
            #scripture {
                display: flex;
                justify-content: space-between;
                height: 100px;
            }
        </style>
    </head>

    <body>
        <div id="formContainer">
            <header>
                <h1>Daily Scripture Feed</h1>
                <h2>Scripture a Day</h2>
            </header>
            <h3>Sign Up for Daily Scripture Feed</h3>
            <form id="myForm">
                <button type="button" id="closeBtn">X</button>
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required />

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required />

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />

                <label>Gender:</label>
                <div>
                    <input
                        type="radio"
                        id="male"
                        name="gender"
                        value="male"
                        required
                    />
                    <label for="male">Male</label>
                    <input
                        type="radio"
                        id="female"
                        name="gender"
                        value="female"
                        required
                    />
                    <label for="female">Female</label>
                </div>

                <section>
                    <input type="checkbox" id="newsletter" name="newsletter" />
                    <label for="newsletter">Subscribe to newsletter</label>
                </section>

                <section>
                    <input
                        type="checkbox"
                        id="conditions"
                        name="conditions"
                        required
                    />
                    <label for="conditions"
                        >I acknowledge the terms and conditions</label
                    >
                </section>

                <section>
                    <button type="submit">Submit</button>
                </section>
            </form>
            <div id="scripture">
                <img src="images/book_of_mormon.webp" />
                <img src="images/doctrine_and_covenants.webp" />
                <img src="images/new_testament.webp" />
                <img src="images/old_testament.webp" />
                <img src="images/pearl_of_great_price.webp" />
            </div>
        </div>

        <div id="output"></div>

        <script>
            // Here is some Javascript to start looking forward to wdd131
            document
                .getElementById("closeBtn")
                .addEventListener("click", function () {
                    document.getElementById("formContainer").style.display =
                        "none";
                });
            const form = document.getElementById("myForm");
            const output = document.getElementById("output");

            form.addEventListener("submit", function (event) {
                event.preventDefault(); // Stop form from actually submitting

                const formData = new FormData(form);
                const entries = [];

                for (const [key, value] of formData.entries()) {
                    if (key == "password") {
                        entries.push(
                            `<strong>${key}</strong>: ${value} (you should probably encrypt the password)`,
                        );
                    } else {
                        entries.push(`<strong>${key}</strong>: ${value}`);
                    }
                }

                output.innerHTML = `
            <br>
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map((item) => `<li>${item}</li>`).join("")}
            </ul>
            `;
            });
        </script>
    </body>
</html>
